<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Homeostasis Challenge</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;height:100vh;overflow:hidden;background:linear-gradient(135deg,#eaf5ff,#f7fbff)}.container{height:100vh;padding:10px;display:flex;flex-direction:column}h1{text-align:center;margin:4px 0;color:#14547d}.top{display:flex;justify-content:space-between;align-items:center}.main{flex:1;display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px}.panel{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}button{padding:8px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.room{background:#90caf9}.cold{background:#64b5f6;color:#fff}.hot{background:#ff8a65;color:#fff}.start{background:#4caf50;color:#fff}.body{text-align:center;font-size:90px}.temp{text-align:center;font-size:3.5rem;font-weight:bold}.status{text-align:center;font-weight:bold}.scale{display:flex;justify-content:space-between}.therm{height:42px;background:#ddd;border-radius:20px;position:relative;overflow:hidden;border:2px solid #666}.fill{height:100%;background:#4caf50;width:58%}.target{position:absolute;left:58.3%;width:4px;height:100%;background:black}.feedback{margin-top:10px;background:#fff8dc;padding:10px;border-radius:8px;text-align:center;font-weight:bold}.control{margin:20px 0}.stats{display:none}.timerBig{text-align:center;font-size:5rem;font-weight:900;color:#000}.warn{color:#ff9800}.danger{color:red;animation:blink .7s infinite}@keyframes blink{50%{opacity:.2}}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center}.card{background:white;padding:30px;border-radius:16px;text-align:center;min-width:320px}
</style></head><body><div class="container"><h1>🌡️ Homeostasis Challenge</h1><div class="top"><div><button class="room" onclick="roomScenario()">🏠 Room</button> <button class="cold" onclick="coldScenario()">❄️ Freezing</button> <button class="hot" onclick="hotScenario()">☀️ Heatwave</button></div><div><select id="mode"><option value="learning">Learning</option><option value="challenge">Challenge</option></select><span id="challengeControls" style="display:none"><select id="len"><option value="30">30s</option><option value="60">60s</option></select><button class="start" onclick="startChallenge()">Start</button></span></div></div><div class="main"><div class="panel"><div><b>Goal:</b> Keep temperature near 37°C.</div><div id="stats" class="stats"><h3>Challenge Stats</h3><p>Time: <span id="timer">0</span></p><p>Score: <span id="score">0</span></p><p>Accuracy: <span id="acc">100</span>%</p><p>Health: <span id="health">100</span></p></div><h3>🧠 Hypothalamus</h3><div id="hypo">Choose a scenario.</div></div><div class="panel"><div id="bigTimer" class="timerBig" style="display:none">30</div><div class="body" id="body">🙂</div><div class="temp" id="temp">37.0°C</div><div class="status" id="status">Choose a scenario</div><div class="scale"><span>30</span><span>32</span><span>34</span><span>36</span><span>37</span><span>38</span><span>40</span><span>42</span></div><div class="therm"><div class="fill" id="fill"></div><div class="target"></div></div><div class="feedback" id="feedback">Choose a scenario or challenge.</div></div><div class="panel"><div class="control">🥶 Shivering <span id="sv">0%</span><input id="shiver" type="range" min="0" max="100" value="0" style="width:100%"></div><div class="control">💦 Sweating <span id="wv">0%</span><input id="sweat" type="range" min="0" max="100" value="0" style="width:100%"></div></div></div></div><div class="overlay" id="overlay"><div class="card"><h2>🏁 Challenge Complete!</h2><p id="results"></p><button onclick="overlay.style.display='none'">Close</button></div></div><script>
let temperature=37,environmentEffect=0,challenge=false,score=0,health=100,time=0,dev=0,samples=0,eventTimer=0;const events=[['Cool Breeze',-0.02],['Winter Day',-0.04],['Arctic Blast',-0.08],['Warm Afternoon',0.02],['Summer Day',0.04],['Heatwave',0.08]];
mode.onchange=()=>{let c=mode.value==='challenge';challengeControls.style.display=c?'inline':'none';stats.style.display=c?'block':'none'};
shiver.oninput=()=>sv.textContent=shiver.value+'%';sweat.oninput=()=>wv.textContent=sweat.value+'%';
function roomScenario(){temperature=37;environmentEffect=0;status.textContent='Comfortable Room'}
function coldScenario(){temperature=35;environmentEffect=-0.04;status.textContent='Freezing Outside'}
function hotScenario(){temperature=39;environmentEffect=0.04;status.textContent='Heatwave'}
function randEvent(){let e=events[Math.floor(Math.random()*events.length)];environmentEffect=e[1];eventTimer=3+Math.random()*5;status.textContent='⚠ '+e[0]}
function startChallenge(){challenge=true;score=0;health=100;time=parseInt(len.value);dev=0;samples=0;temperature=37;bigTimer.style.display='block';randEvent();}
function endChallenge(){challenge=false;bigTimer.style.display='none';let accuracy=Math.max(0,Math.round(100-(dev/Math.max(samples,1))*20));let grade=accuracy>=95?'A+':accuracy>=90?'A':accuracy>=80?'B':accuracy>=70?'C':'D';results.innerHTML='Score: '+Math.round(score)+'<br>Accuracy: '+accuracy+'%<br>Health: '+Math.round(health)+'<br>Grade: '+grade;overlay.style.display='flex';}
setInterval(()=>{temperature+=environmentEffect+(shiver.value/100)*0.12-(sweat.value/100)*0.12;temperature=Math.max(30,Math.min(42,temperature));let pct=((temperature-30)/12)*100;fill.style.width=pct+'%';temp.textContent=temperature.toFixed(1)+'°C';body.textContent=temperature<36?'🥶':temperature>38?'🥵':'🙂';if(mode.value==='learning'){hypo.innerHTML=temperature<37?'Increase Shivering':temperature>37?'Increase Sweating':'At set point';}
if(challenge){eventTimer-=0.2;if(eventTimer<=0)randEvent();time=Math.max(0,time-0.2);let sec=Math.ceil(time);timer.textContent=sec;bigTimer.textContent=sec;bigTimer.className='timerBig';if(sec<=7&&sec>0)bigTimer.classList.add('warn');if(sec===0)bigTimer.classList.add('danger');let d=Math.abs(temperature-37);dev+=d;samples++;score+=d<=.25?5:d<=.5?3:d<=1?1:0;if(temperature<35||temperature>39)health-=.3;if(temperature<34||temperature>40)health-=1;health=Math.max(0,health);scoreEl=score;document.getElementById('score').textContent=Math.round(score);document.getElementById('health').textContent=Math.round(health);document.getElementById('acc').textContent=Math.max(0,Math.round(100-(dev/Math.max(samples,1))*20));if(time<=0||health<=0)endChallenge();} },200);
</script></body></html>
